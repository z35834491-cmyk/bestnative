# ============================================================
# BestNative — 本地开发 / 测试环境 docker compose
# 全栈：frontend(next.js) + api(fastapi) + postgres(pgvector) + redis
# Prometheus / ES 复用现有基础设施，不在此 compose 中
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bestnative-postgres
    environment:
      POSTGRES_USER: bestnative
      POSTGRES_PASSWORD: bestnative
      POSTGRES_DB: bestnative
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestnative"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bestnative-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bestnative-api
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://bestnative:bestnative@postgres:5432/bestnative
      DATABASE_URL_SYNC: postgresql://bestnative:bestnative@postgres:5432/bestnative
      REDIS_URL: redis://redis:6379/0
      KUBECONFIG: /tmp/kubeconfig
    ports:
      - "8000:8000"
    volumes:
      - ${KUBECONFIG:-~/.kube/config}:/tmp/kubeconfig.orig:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 复制 kubeconfig + 设 context + 建表 + 启动
    command: ["/app/entrypoint.sh"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_ENV: development
    container_name: bestnative-frontend
    environment:
      NEXT_PUBLIC_ENV: development
      INTERNAL_API_URL: http://api:8000
    ports:
      - "3456:3456"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
